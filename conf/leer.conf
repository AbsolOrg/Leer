# /etc/leer.conf — leer configuration
# This file is sourced as bash; keep syntax simple.

# Snapshots to retain (prune default)
LEER_KEEP=10
LEER_MIN_KEEP=3

# Storage location (absolute path; must live on a mounted filesystem)
#SNAP_DIR="/mnt/backups/leer"

# Home paths to capture.
# "auto" = ~/.config, theme/font/icon dirs (see THEME_DIRS) plus all
# top-level dotfiles (history/secret/regenerable files filtered out)
# Or list explicitly, e.g.: HOME_PATHS=(.config .zshrc .local/share/konsole)
HOME_PATHS=(auto)

# Include ~/.themes ~/.icons ~/.fonts in "auto" mode (set 0 to disable)
THEME_DIRS=1

# Capture /etc as well
ETC_ENABLE=1

# Pin the user home used when leer runs as root (pkexec/sudo/timer).
# Empty = auto-detect from invoking user. Example: TARGET_HOME="/home/alice"
TARGET_HOME=""

# Basename patterns excluded everywhere (caches etc.)
GLOBAL_EXCLUDES=(
    Cache "Code Cache" GPUCache GrShaderCache ShaderCache DawnCache
    CachedData "Crash Reports" "*.tmp-cfg"
)
